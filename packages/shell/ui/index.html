<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src http://127.0.0.1:* http://localhost:*" />
    <title>Mimir</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header class="rail">
      <div class="rail__left">
        <span class="wordmark">Mímir</span>
        <span class="rail__model" id="model-name">connecting…</span>
      </div>
      <div class="rail__right">
        <button id="btn-vault" class="rail__button" type="button" title="Show the vault folder">Vault</button>
        <button id="btn-size" class="rail__button" type="button" title="Reading size">A</button>
      </div>
    </header>

    <main id="stream" class="stream" aria-live="polite">
      <section class="invocation">
        <h1>What are we learning?</h1>
        <p>
          Say the thing you want to understand. The teacher will ask what you already hold,
          propose a map, and wait for your go-ahead before it teaches.
        </p>
      </section>
    </main>

    <footer class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Teach me…"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="send" type="button" class="send">Ask</button>
    </footer>

    <div id="error" class="error" hidden></div>

    <script type="module" src="chat.js"></script>
  </body>
</html>
